services:
  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    volumes:
      # Mount plugin root (.) so Grafana finds plugin.json and dist/module.js. Run from plugin directory.
      - .:/var/lib/grafana/plugins/grafana-3d-dc-twin
      - ./provisioning:/etc/grafana/provisioning
